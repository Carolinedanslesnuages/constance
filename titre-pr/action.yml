name: Constance — titre de PR
description: Vérifie que le titre de la pull request suit Conventional Commits, propose une correction sinon, et prévient si le réglage de fusion en squash du dépôt peut l'ignorer.
author: Carolinedanslesnuages

inputs:
  types:
    description: Types autorisés, séparés par des espaces.
    default: "feat fix perf refactor docs test build ci chore style revert"
  ignorer-bots:
    description: Ne pas bloquer les PR ouvertes par un robot (Dependabot, Renovate…) dont le titre n'est pas conforme.
    default: "true"
  verifier-reglage-squash:
    description: Lire le réglage de fusion en squash du dépôt et prévenir s'il n'utilise pas le titre de la PR (lisible seulement avec un jeton qui a les droits d'administration).
    default: "true"
  jeton:
    description: Jeton utilisé pour lire le réglage de fusion.
    default: ${{ github.token }}
  rose:
    description: "Vérifier aussi l'emoji Rose du titre (« feat: 🌸 … »), voir https://github.com/Carolinedanslesnuages/rose. Les PR des robots ne sont pas vérifiées."
    default: "false"

runs:
  using: composite
  steps:
    - name: Lire le réglage de fusion en squash
      id: squash
      if: inputs.verifier-reglage-squash == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.jeton }}
        REPOSITORY: ${{ github.repository }}
      run: |
        value=$(gh api "repos/$REPOSITORY" --jq '.squash_merge_commit_title // empty' 2>/dev/null || true)
        echo "value=$value" >> "$GITHUB_OUTPUT"

    - name: Vérifier le titre
      shell: bash
      env:
        TITLE: ${{ github.event.pull_request.title }}
        AUTHOR: ${{ github.event.pull_request.user.login }}
        TYPES: ${{ inputs.types }}
        IGNORE_BOTS: ${{ inputs.ignorer-bots }}
        SQUASH_SETTING: ${{ steps.squash.outputs.value }}
      run: bash "${{ github.action_path }}/check.sh"

    # Option: the Rose emoji matches the type (action pinned to its commit hash).
    - name: Vérifier l'emoji Rose
      if: inputs.rose == 'true'
      uses: Carolinedanslesnuages/rose@2dfd0171b64112ad1e812238a9cc7b47637e426f # v1.0.0
