name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  tests:
    name: Tests et shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configurer git pour les dépôts d'essai
        run: |
          git config --global user.email "essai@exemple.fr"
          git config --global user.name "essai"
          git config --global init.defaultBranch main
      - name: Tests
        run: bash tests/run.sh
      - name: shellcheck
        run: shellcheck -x taille-fichiers/check.sh titre-pr/check.sh nommage-fichiers/check.sh variables-env/check.sh tests/*.sh

  # Constance applies its own checks to its pull requests.
  titre:
    name: Titre de PR (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./titre-pr
        with:
          rose: "true"

  taille:
    name: Taille des fichiers (une responsabilité par fichier)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./taille-fichiers
        with:
          extensions: "sh"

  nommage:
    name: Nommage des fichiers (kebab-case, PascalCase.vue)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./nommage-fichiers
        with:
          extensions: "sh"

  anti-fuite:
    name: Anti-fuite (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./anti-fuite
